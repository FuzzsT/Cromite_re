name: Cromite Re Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cromite-re-sync-release.yml'
      - '.cromite-re/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream
        run: git clone --depth 1 --branch master https://github.com/uazo/cromite.git "$RUNNER_TEMP/cromite-upstream"

      - name: Mirror upstream
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.cromite-re/' \
            --exclude='.github/workflows/' \
            --exclude='README-CROMITE-RE.md' \
            "$RUNNER_TEMP/cromite-upstream/" ./

      - name: Generate latest Pixel UA patch
        run: python3 .cromite-re/generate_auto_ua.py --repo . --profile pixel

      - name: Commit sync
        run: |
          git config user.name 'Cromite Re Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "sync: upstream + latest Chrome Pixel UA"
          git push origin HEAD:main

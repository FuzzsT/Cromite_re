name: Cromite Re Sync

# A successful sync triggers the separate Cromite Re Build Release workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cromite-re-sync-release.yml'
      - '.cromite-re/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream
        run: git clone --depth 1 --branch master https://github.com/uazo/cromite.git "$RUNNER_TEMP/cromite-upstream"

      - name: Mirror upstream
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.cromite-re/' \
            --exclude='.github/workflows/' \
            --exclude='README-CROMITE-RE.md' \
            "$RUNNER_TEMP/cromite-upstream/" ./

      - name: Generate latest Pixel UA patch
        run: python3 .cromite-re/generate_auto_ua.py --repo . --profile pixel

      - name: Write sync metadata
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          upstream = Path(__import__('os').environ['RUNNER_TEMP']) / 'cromite-upstream'
          sha = subprocess.check_output(['git', '-C', str(upstream), 'rev-parse', 'HEAD'], text=True).strip()
          version = Path('build/RELEASE').read_text(encoding='utf-8').strip()
          ua = json.loads(Path('build/CROMITE_RE_UA.json').read_text(encoding='utf-8'))
          data = {
              'upstream_repository': 'uazo/cromite',
              'upstream_branch': 'master',
              'upstream_sha': sha,
              'cromite_version': version,
              'chrome_stable': ua['chrome_stable'],
              'chrome_major': ua['chrome_major'],
              'ua_mode': ua['mode'],
              'user_agent': ua['user_agent'],
          }
          Path('build/CROMITE_RE_SYNC.json').write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(data, indent=2))
          PY

      - name: Commit sync
        run: |
          git config user.name 'Cromite Re Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "sync: upstream + latest Chrome Pixel UA"
          git push origin HEAD:main
